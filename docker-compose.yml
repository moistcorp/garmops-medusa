name: garmops-medusa

x-medusa-environment: &medusa-environment
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-9000}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  CACHE_REDIS_URL: ${CACHE_REDIS_URL:-${REDIS_URL}}
  LOCKING_REDIS_URL: ${LOCKING_REDIS_URL:-${REDIS_URL}}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
  STORE_CORS: ${STORE_CORS:-http://localhost:3000,http://localhost:9000}
  ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
  AUTH_CORS: ${AUTH_CORS:-http://localhost:3000,http://localhost:9000}
  MEDUSA_BACKEND_URL: ${MEDUSA_BACKEND_URL:-http://localhost:9000}
  PAYU_ENV: ${PAYU_ENV:-test}
  PAYU_KEY: ${PAYU_KEY:-}
  PAYU_SALT: ${PAYU_SALT:-}
  PAYU_CALLBACK_URL: ${PAYU_CALLBACK_URL:-http://localhost:9000/garmops/payments/payu/callback}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-}
  R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
  MALWARE_SCANNER_HOST: ${MALWARE_SCANNER_HOST:-malware-scanner}
  MALWARE_SCANNER_PORT: ${MALWARE_SCANNER_PORT:-3310}
  MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-15000}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM: ${RESEND_FROM:-Garmops <noreply@example.com>}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:9000/auth/customer/google/callback}
  AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:-}
  INVOICE_SELLER_NAME: ${INVOICE_SELLER_NAME:-Garmops}
  INVOICE_SELLER_GSTIN: ${INVOICE_SELLER_GSTIN:-}
  INVOICE_SELLER_ADDRESS: ${INVOICE_SELLER_ADDRESS:-}
  INVOICE_SELLER_STATE: ${INVOICE_SELLER_STATE:-}
  INVOICE_SELLER_PIN: ${INVOICE_SELLER_PIN:-}

x-medusa-depends-on: &medusa-depends-on
  redis:
    condition: service_healthy
  malware-scanner:
    condition: service_healthy

services:
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [backend]

  malware-scanner:
    image: clamav/clamav:stable-debian
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 /etc/hosts >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [backend]

  medusa:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      <<: *medusa-environment
      MEDUSA_WORKER_MODE: ${MEDUSA_WORKER_MODE:-shared}
      DISABLE_MEDUSA_ADMIN: ${DISABLE_MEDUSA_ADMIN:-false}
    command: ["/server/docker/start-dev.sh"]
    depends_on: *medusa-depends-on
    ports:
      - "127.0.0.1:${PORT:-9000}:9000"
    volumes:
      - ./apps/backend/src:/server/apps/backend/src
      - ./apps/backend/medusa-config.ts:/server/apps/backend/medusa-config.ts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
    networks: [backend]

  medusa-server:
    profiles: [production]
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      <<: *medusa-environment
      MEDUSA_WORKER_MODE: server
      DISABLE_MEDUSA_ADMIN: "false"
    command: ["/server/docker/start-production.sh"]
    depends_on:
      <<: *medusa-depends-on
    # The reverse proxy owns the public 80/443 listeners. Keep Medusa on the
    # loopback interface so the application port is not internet-reachable.
    ports:
      - "127.0.0.1:${PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 9000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
    networks: [backend]

  medusa-worker:
    profiles: [production]
    build:
      context: .
      target: production
    restart: unless-stopped
    environment:
      <<: *medusa-environment
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    command: ["npm", "start"]
    depends_on:
      medusa-server:
        condition: service_healthy
    networks: [backend]

volumes:
  redis_data:
    name: garmops_medusa_redis_data
  clamav_data:
    name: garmops_medusa_clamav_data

networks:
  backend:
    name: garmops_medusa_backend
